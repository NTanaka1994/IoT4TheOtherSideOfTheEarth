<div style="width: 20%;">
  <canvas id="hum"></canvas>
</div>
<div style="width: 20%;">
  <canvas id="tmp"></canvas>
</div>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.3.0/dist/leaflet.css" />
<script src="https://unpkg.com/leaflet@1.3.0/dist/leaflet.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/3.2.0/chart.min.js" integrity="sha512-VMsZqo0ar06BMtg0tPsdgRADvl0kDHpTbugCBBrL55KmucH6hP9zWdLIWY//OTfMnzz6xWQRxQqsUFefwHuHyg==" crossorigin="anonymous"></script>
<script src="https://cdn.jsdelivr.net/npm/chartjs-adapter-date-fns@next/dist/chartjs-adapter-date-fns.bundle.min.js"></script>
<style>
  #mapcontainer { width: 100%; height: 360px; margin-top: 8px; }
</style>
<script>
    addr = "get-state"
    res = "";
    xhr = new XMLHttpRequest()
    xhr.onreadystatechange = function(){
        if (xhr.readyState == 4 && xhr.status==200){
            res = xhr.responseText;
        }
    }
    xhr.open("GET", addr, false);
    xhr.send(null);
    var jsn = JSON.parse(res);
    var hum = jsn.hum;
    var tmp = jsn.tmp;
    var co2 = jsn.co2;
    var x = jsn.x;
    var ctx_hum = document.getElementById("hum").getContext('2d');
            var myChart_hum = new Chart(ctx_hum, {
                type: 'line',
                data: {
                    labels: x,
                    datasets: [{
                        label: 'hum',
                        data: hum,
                        borderColor: [
                            'rgba(0, 0, 255, 1)'
                        ],
                        borderWidth: 1
                    }]
                },
                options: {
                    scales: {
                        yAxes: [{
                            ticks: {
                                beginAtZero:true
                            }
                        }]
                    }
                }
            });
    var ctx_tmp = document.getElementById("tmp").getContext('2d');
            var myChart_tmp = new Chart(ctx_tmp, {
                type: 'line',
                data: {
                    labels: x,
                    datasets: [{
                        label: 'tmp',
                        data: tmp,
                        borderColor: [
                            'rgba(255, 0, 0, 1)'
                        ],
                        borderWidth: 1
                    }]
                },
                options: {
                    scales: {
                        yAxes: [{
                            ticks: {
                                beginAtZero:true
                            }
                        }]
                    }
                }
            });
    setInterval(async function(){
        addr = "get-state"
        res = "";
        xhr = new XMLHttpRequest()
        xhr.onreadystatechange = function(){
            if (xhr.readyState == 4 && xhr.status==200){
                res = xhr.responseText;
            }
        }
        xhr.open("GET", addr, false);
        xhr.send(null);
        var jsn = JSON.parse(res);
        var hum = jsn.hum;
        var tmp = jsn.tmp;
        var x = jsn.x;
        myChart_hum.data.labels = x;
        myChart_hum.data.datasets[0].data = hum;
        myChart_hum.update('none');
        myChart_tmp.data.labels = x;
        myChart_tmp.data.datasets[0].data = tmp;
        myChart_tmp.update('none');
    }, 500);
    function init(){
        addr = "get-geo"
        res = "";
        xhr = new XMLHttpRequest()
        xhr.onreadystatechange = function(){
            if (xhr.readyState == 4 && xhr.status==200){
                res = xhr.responseText;
            }
        }
        xhr.open("GET", addr, false);
        xhr.send(null);
        jsn = JSON.parse(res);
        kei = jsn.coordinates[0];
        ido = jsn.coordinates[1];
        console.log(kei);
        console.log(ido);

        var map = L.map('mapcontainer',{zoomControl:false});
        var mpoint = [ido, kei];
        map.setView(mpoint, 15);
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OpenStreetMap contributors'
        }).addTo(map);
        setInterval(async function(){
            addr = "get-geo"
            res = "";
            xhr = new XMLHttpRequest()
            xhr.onreadystatechange = function(){
                if (xhr.readyState == 4 && xhr.status==200){
                    res = xhr.responseText;
                }
            }
            xhr.open("GET", addr, false);
            xhr.send(null);
            jsn = JSON.parse(res);
            kei = jsn.coordinates[0];
            ido = jsn.coordinates[1];
            var mpoint = [ido, kei];
            map.setView(mpoint, 15);
            L.marker(mpoint,{title:"現在地", draggable:true}).addTo(map);
        }, 500);
    }
</script>
<body onload="init()">
    <div id="mapcontainer"  style="width:600px;height:600px"></div>

</body>
